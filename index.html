<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Okey 101">
    <meta name="theme-color" content="#1a4d2e">
    <title>Okey 101</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Permanent+Marker&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Üst Menü / Navbar (Artık Oyun Konteynırı İçinde) -->
        <header class="top-nav">
            <div class="logo">OKEY 101</div>
            <div class="nav-actions">
                <button class="nav-btn" id="new-game-top"><span>🔄</span> YENİ OYUN</button>
                <button class="nav-btn" id="show-yazboz"><span>📝</span> YAZ-BOZ</button>
                <button class="nav-btn" id="open-settings"><span>⚙️</span> AYARLAR</button>
            </div>
        </header>

        <div class="table">
            <!-- Atılan Taş Alanları (Boşluklar) - Sabit Yerleşimler için DOM'da Taşındı -->

            <!-- Bot-2 (Karşı) -->
            <div class="player-slot top" id="bot-2">
                <div class="bot-rack-container">
                    <!-- Bot 3'ten TAŞ AL -->
                    <div class="discard-zone side-slot left-take" id="discard-bot-3"></div>
                    <div class="bot-rack bot-rack-top">
                        <div class="name-tag">Deniz</div>
                    </div>
                    <!-- Kendi Taşını AT (Bot 1'e) -->
                    <div class="discard-zone side-slot right-discard" id="discard-bot-2"></div>
                </div>
            </div>

            <!-- Bot-1 (Sol) -->
            <div class="player-slot left" id="bot-1">
                <div class="bot-rack bot-rack-left">
                    <div class="name-tag">Samet</div>
                </div>
            </div>

            <!-- Bot-3 (Sağ) -->
            <div class="player-slot right" id="bot-3">
                <div class="bot-rack bot-rack-right">
                    <div class="name-tag">Sinem</div>
                </div>
            </div>

            <!-- Orta Alan: Bölünmüş Oyun Alanı -->
            <div class="center-grid-container">
                <!-- Seri Açma Alanı (%70) -->
                <div class="play-section" id="series-section">
                    <div class="section-label">SERİLER</div>
                    <div class="field-area" id="series-field">
                        <!-- Seriler buraya tık tık dizilecek -->
                    </div>
                </div>

                <!-- Ayırıcı Çizgi -->

                <!-- Çift Açma Alanı (%30) -->
                <div class="play-section" id="pairs-section">
                    <div class="section-label">ÇİFTLER</div>
                    <div class="field-area" id="pairs-field">
                        <!-- Çiftler buraya dikey dizilecek -->
                    </div>
                </div>

                <!-- Deste ve Gösterge Bölümü (Bağımsız ve Üst Katmanda) -->
                <div class="center-deck-area">
                    <div class="deck-pile-wrap">
                        <div class="deck-pile" id="deck-pile"></div>
                        <div class="deck-count">20</div>
                    </div>
                    <div class="indicator-tile" id="indicator-tile">
                        <!-- Gösterge taşı buraya gelecek -->
                    </div>
                </div>
            </div>

            <!-- Kullanıcı Bölgesi -->
            <div class="user-bottom" id="player-user">
                <div class="user-rack-area">
                    <div class="name-tag user-name">Fatih</div>
                    <!-- Aksiyon Butonları (Istaka Üstü) -->
                    <div class="rack-actions">
                        <button class="action-rect btn-sort" id="btn-sort-series">SERİ</button>
                        <button class="action-rect btn-sort" id="btn-sort-pairs">ÇİFT</button>
                        <button class="action-rect btn-draw pulse-draw" id="btn-draw-stone">TAŞ ÇEK</button>
                        <div class="action-divider"></div>
                        <button class="action-rect btn-open" id="btn-open-series">SERİ AÇ</button>
                        <button class="action-rect btn-open" id="btn-open-pairs">ÇİFT AÇ</button>
                        <button class="action-rect btn-util" id="btn-process">İŞLE</button>
                        <button class="action-rect btn-util" id="btn-discard">AT</button>
                        <button class="action-rect btn-util" id="btn-undo">GERİ AL</button>

                        <!-- El İstatistikleri -->
                        <div class="hand-stats">
                            <div class="stat-item"><span class="stat-label">PUAN:</span> <span id="hand-points">0</span>
                            </div>
                            <div class="stat-item"><span class="stat-label">ÇİFT:</span> <span id="hand-pairs">0</span>
                            </div>
                        </div>
                    </div>


                    <div class="user-rack-container">
                        <!-- TAŞ AL (Bot 1'den gelen) -->
                        <div class="discard-zone side-slot left-take" id="discard-bot-1"></div>

                        <div class="rack-wrapper">
                            <div class="rack-grid">
                                <div class="rack-row" id="row-1"></div>
                                <div class="rack-row" id="row-2"></div>
                            </div>
                        </div>

                        <!-- TAŞ AT (Kendi atacağımız) -->
                        <div class="discard-zone side-slot right-discard" id="discard-user"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Yaz-Boz (Skor Board) Modal -->
    <div id="scoreboard-modal" class="modal">
        <div class="modal-content scoreboard-content">
            <h2 class="scoreboard-title">📝 YAZ-BOZ</h2>
            <div class="score-scroll">
                <table id="score-table">
                    <thead>
                        <tr id="score-header-row">
                            <th>OYUNCU</th>
                            <!-- El sütunları dinamik gelecek -->
                            <th>TOPLAM</th>
                        </tr>
                    </thead>
                    <tbody id="score-body">
                        <!-- Puanlar dinamik gelecek -->
                    </tbody>
                </table>
            </div>
            <div class="modal-actions">
                <button class="modal-btn primary" id="next-round-btn">SONRAKİ EL ▶</button>
                <button class="modal-btn danger" id="restart-btn">OYUNU SİFİRLA</button>
            </div>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div id="settings-modal" class="modal">
        <div class="modal-content settings-content">
            <h2 class="scoreboard-title">⚙️ AYARLAR</h2>

            <div class="settings-group">
                <h3>OYUNCU İSİMLERİ</h3>
                <div class="input-row">
                    <label>Sen:</label>
                    <input type="text" id="name-user" placeholder="Adınız" maxlength="12">
                </div>
                <div class="input-row">
                    <label>Sol:</label>
                    <input type="text" id="name-bot1" placeholder="Samet" maxlength="12">
                </div>
                <div class="input-row">
                    <label>Karşı:</label>
                    <input type="text" id="name-bot2" placeholder="Deniz" maxlength="12">
                </div>
                <div class="input-row">
                    <label>Sağ:</label>
                    <input type="text" id="name-bot3" placeholder="Sinem" maxlength="12">
                </div>
            </div>

            <div class="settings-group">
                <h3>EL SAYISI</h3>
                <div class="round-selector">
                    <button class="round-btn" id="rounds-dec">◀</button>
                    <span id="rounds-display">5</span>
                    <button class="round-btn" id="rounds-inc">▶</button>
                </div>
                <div class="round-hint">1 ile 11 el arası (Standart: 5)</div>
            </div>

            <button class="modal-btn primary" id="save-settings">KAYDET</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
